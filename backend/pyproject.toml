[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-assistant"
version = "0.1.0"
description = "Local multilingual (Hindi-English) meeting assistant: ASR, diarization, Hinglish normalization, summarization and evaluation"
# No `readme` field: the project README lives at the repo root, and setuptools
# refuses to read files outside the package directory. See ../README.md.
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Rushikesh Giri" }]
keywords = ["speech-recognition", "diarization", "code-mixing", "hinglish", "meeting-summarization"]

# Python is pinned to 3.12 deliberately. On 3.14 there are no prebuilt
# wheels for webrtcvad or several packages in the torch/pyannote stack on
# Windows, which forces a C compiler toolchain into the setup path.
dependencies = [
    "faster-whisper>=1.2",
    "pyannote.audio>=4.0",
    "webrtcvad-wheels>=2.0.14",
    "sounddevice>=0.5",
    "numpy>=2.0",
    "ollama>=0.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Metrics for the evaluation study.
eval = [
    "jiwer>=3.0",              # WER / CER with substitution-deletion-insertion breakdown
    "pyannote.metrics>=4.0",   # DER, decomposed into confusion / missed / false alarm
    "rouge-score>=0.1.2",      # summarization overlap metrics
    "indic-transliteration>=2.3",  # deterministic Devanagari <-> Roman for cross-script WER
    "scikit-learn>=1.5",       # language-ID P/R/F1, confusion matrix, Cohen's kappa
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyyaml>=6.0",             # declarative experiment configs
]
# HTTP layer consumed by the React frontend. No migration tool: the schema is
# CREATE ... IF NOT EXISTS and fully rebuildable from disk (`reindex`), so one
# is added only when a real migration exists.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",  # audio upload
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI's TestClient
]

[project.scripts]
meeting-assistant = "meeting_assistant.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
meeting_assistant = ["store/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# E402 (module-level import not at top of file) is suppressed only where a
# module must register the FFmpeg DLL directory before importing
# pyannote.audio. That ordering is load-bearing, not a style slip — see
# meeting_assistant/bootstrap/ffmpeg_dll.py.

[tool.ruff.lint.per-file-ignores]
# Prompt bodies are experimental content sent verbatim to a language model,
# not code to be wrapped for readability -- wrapping them would edit the
# exact text a prompt version constant is supposed to pin. See
# meeting_assistant/llm/prompts.py's module docstring.
"src/meeting_assistant/llm/prompts.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and parameters as default-argument calls; they
# are evaluated per request by the framework, not once at definition time.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.File",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run must stay fast and hermetic: no model loading, no Ollama,
# no microphone, no network. Opt in explicitly when you want those.
addopts = "-q -m 'not slow and not integration'"
markers = [
    "slow: loads a real model or otherwise takes more than a second",
    "integration: needs real audio, a live Ollama server, or a microphone",
]
